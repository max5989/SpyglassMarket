<section class="demo-search-engine">

    <div class="search-window">

        <div class="search-bar">

            <span class="search-icon">🔍</span>

            <input
                id="demoSearch"
                type="text"
                readonly
                autocomplete="off">

        </div>

        <div class="progress-area">

            <div class="market">
                <span>eBay</span>
                <div class="bar"><div id="ebayBar"></div></div>
            </div>

            <div class="market">
                <span>Facebook Marketplace</span>
                <div class="bar"><div id="fbBar"></div></div>
            </div>

            <div class="market">
                <span>Craigslist</span>
                <div class="bar"><div id="clBar"></div></div>
            </div>

            <div class="market">
                <span>OfferUp</span>
                <div class="bar"><div id="ouBar"></div></div>
            </div>

        </div>

        <div id="statusText"></div>

        <div id="results" class="results"></div>

    </div>

</section>
